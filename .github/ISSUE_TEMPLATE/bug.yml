name: Bug report
description: Report a reproducible problem with the library or playground.
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include expected behavior, actual behavior, version and provider. Never include credentials or private input.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Minimal reproduction
      render: typescript
    validations:
      required: true
