name: Publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v') && vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run check
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e 'const p=require("./packages/sysone/package.json"); if(process.env.RELEASE_TAG !== "v"+p.version) process.exit(1)'
      - run: npm publish --workspace @sysone-help/sysone --access public --provenance
